services:
  cnc-monitor:
    image: fwlib-minimal-rpi:latest
    platform: linux/arm/v7
    build:
      context: ../..
      dockerfile: deploy/rpi/Dockerfile
    network_mode: host
    restart: unless-stopped
    volumes:
      - focas-comm-conf:/config:ro

volumes:
  focas-comm-conf:
    external: true