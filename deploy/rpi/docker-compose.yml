services:
  fwlib:
    image: strangesast/fwlib
    build:
      context: .
      dockerfile: Dockerfile

  example:
    image: strangesast/fwlib-example
    build:
      context: .
      dockerfile: examples/c-minimal/Dockerfile
    network_mode: host
    depends_on:
      - fwlib
    volumes:
      - focas-comm-conf:/config:ro

volumes:
  focas-comm-conf:
    external: true