version: '3.7'
services:
  fwlib:
    platform: linux/amd64
    image: strangesast/fwlib
    build:
      context: .
      dockerfile: Dockerfile

  example:
    platform: linux/amd64
    image: strangesast/fwlib-example
    network_mode: host
    build:
      context: .
      dockerfile: examples/c-minimal/Dockerfile
    depends_on:
      - fwlib
    environment:
      MACHINE_01: "192.168.10.210"
      MACHINE_02: "192.168.10.211"
      MACHINE_03: "192.168.10.212"
      MACHINE_04: "192.168.10.213"
      MACHINE_05: "192.168.10.214"
      MACHINE_06: "192.168.10.215"
      MACHINE_07: "192.168.10.216"
      MACHINE_08: "192.168.10.217"
      MACHINE_09: "192.168.10.218"
      MACHINE_10: "192.168.10.219"

